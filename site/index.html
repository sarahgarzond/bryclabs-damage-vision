<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damage Evidence Extractor</title>
  <meta name="description" content="Upload a property damage photo and get verified, structured evidence as JSON and CSV.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>
  <header class="top">
    <span class="brand">Damage Evidence</span>
    <button class="status" id="statusPill" type="button" aria-haspopup="dialog" aria-label="Model settings" title="Model settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      <span class="dot" aria-hidden="true"></span><span id="statusText" class="sr-only">Model settings</span>
    </button>
  </header>

  <main class="page">

    <label class="drop" id="drop" for="fileInput" tabindex="0">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="drop-empty" id="dropEmpty">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 32V12m0 0l-8 8m8-8l8 8"/><path d="M8 32v5a4 4 0 004 4h24a4 4 0 004-4v-5"/></svg>
        <strong>Drop a damage photo to analyse</strong>
        <span class="pick">Choose photo</span>
        <span>JPG, PNG or HEIC · paste works too</span>
      </div>
      <div class="stage" id="stage" hidden>
        <img id="photo" alt="Uploaded photo">
        <div class="boxes" id="boxes"></div>
        <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyText">Analysing…</span></div>
      </div>
    </label>

    <p class="examples" id="examples"></p>

    <section class="out" id="out" hidden>
      <div class="notice" id="notice" hidden></div>
      <div class="actions">
        <button class="btn primary" id="csvBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>Download CSV
        </button>
        <button class="btn" id="jsonBtn" type="button">Download JSON</button>
        <button class="btn" id="copyBtn" type="button">Copy JSON</button>
        <span class="meta" id="meta"></span>
      </div>
      <pre class="json" id="json"></pre>
    </section>
  </main>

  <dialog id="connectDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>Connect the model</h3>
      <p>Paste the https address of the running API. Without it, only the examples work.</p>
      <input type="url" id="apiInput" placeholder="https://your-tunnel.trycloudflare.com" autocomplete="off">
      <p class="test" id="testResult"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="disconnectBtn">Demo mode</button>
        <span class="spacer"></span>
        <button class="btn" type="button" id="testBtn">Test</button>
        <button class="btn primary" type="button" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js?v=5"></script>
</body>
</html>
