name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure the vision backend URL
        env:
          DAMAGE_API_URL: ${{ vars.DAMAGE_API_URL }}
        run: |
          mkdir -p site/data
          python -c 'import json, os; print(json.dumps({"api_url": os.environ["DAMAGE_API_URL"]}))' > site/data/api-config.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq '.artifacts[] | .name' | grep -Fxq github-pages; then
              exit 0
            fi
            sleep 5
          done
          echo "The Pages artifact did not become visible."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
