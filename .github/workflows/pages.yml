name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure the vision backend URL
        env:
          DAMAGE_API_URL: ${{ vars.DAMAGE_API_URL || 'https://bryclabs-damage-vision.vercel.app' }}
        run: |
          mkdir -p site/data
          python -c 'import json, os; print(json.dumps({"api_url": os.environ["DAMAGE_API_URL"]}))' > site/data/api-config.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const endpoint = 'POST /repos/{owner}/{repo}/pages/deployments';
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {...repo, run_id: context.runId}
            );
            const artifact = artifacts.find(item => item.name === 'github-pages' && !item.expired);
            if (!artifact) throw new Error('Pages artifact is missing from the run');
            const {data: deployment} = await github.request(endpoint, {
              ...repo,
              artifact_id: artifact.id,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', deployment.page_url);
            for (let attempt = 0; attempt < 36; attempt++) {
              const {data} = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                {...repo, deployment_id: deployment.id}
              );
              if (data.status === 'succeed') return;
              if (['deployment_failed', 'failed', 'cancelled', 'error'].includes(data.status)) {
                throw new Error('Pages deployment status: ' + data.status);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Timed out waiting for the Pages deployment');
