[project]
name = "damagevision"
version = "0.1.0"
description = "Property damage photo -> verified, structured evidence (BrycLabs hackathon)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pillow>=10.0", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
